<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasker is offline</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #0a0a0a;
        color: #f4f4f5;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      .card {
        border: 1px solid #27272a;
        border-radius: 20px;
        padding: 32px;
        max-width: 420px;
        background: #0f0f11;
        text-align: center;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.6;
      }
      .actions {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid #3f3f46;
        color: #f4f4f5;
        background: #111113;
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      .btn:hover {
        border-color: #52525b;
      }
      .btn-primary {
        background: #f4f4f5;
        color: #111113;
        border-color: #f4f4f5;
      }
      .btn-primary:hover {
        background: #e4e4e7;
        border-color: #e4e4e7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        Tasker needs a connection to sync tasks. Check your internet and try
        again.
      </p>
      <div class="actions">
        <button class="btn btn-primary" onclick="window.location.reload()">
          Try again
        </button>
        <a class="btn" href="/">Back to home</a>
      </div>
    </div>
  </body>
</html>
